name: Windows source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Syntax, versions and deterministic tests
        run: node scripts/check.mjs
      - name: Compile Windows launcher and installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path runtime,.state -Force | Out-Null
          Copy-Item -LiteralPath (Get-Command node).Source -Destination runtime/node.exe
          ./scripts/build-launcher.ps1
          $compiler=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $refs=@('System','System.Core','System.Drawing','System.Windows.Forms','System.Web.Extensions','System.IO.Compression','System.IO.Compression.FileSystem') | ForEach-Object { '/reference:'+$_+'.dll' }
          $sources=@('Setup.cs','SetupBrand.cs','Uninstall.cs','SetupTests.cs') | ForEach-Object { Join-Path $env:GITHUB_WORKSPACE ('scripts/'+$_) }
          $output=Join-Path $env:GITHUB_WORKSPACE '.state/SetupTests.exe'
          & $compiler /nologo /target:exe /main:SetupTests @refs ("/out:"+$output) @sources
          if($LASTEXITCODE -ne 0){throw 'Installer test compilation failed.'}
          & $output (Join-Path $env:GITHUB_WORKSPACE '.state/setup-tests')
          if($LASTEXITCODE -ne 0){throw 'Installer checks failed.'}

# Model benchmarks and offline package qualification need the pinned multi-GB
# assets and physical target hardware. This workflow does not claim either.
